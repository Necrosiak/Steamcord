<?xml version="1.0" encoding="UTF-8"?>
<!--
  Steamcord mark — the single source for every rendering of the logo.
  src/components/Icons.tsx transcribes these shapes, and assets/logo.png is
  rendered from this file, so edit here first.

  Monochrome, transparent, no tile and no border: it has to sit next to the
  Bootstrap icons of the panel and take the colour of the text around it, so
  everything is drawn in `currentColor`. The S and C are real HOLES in the
  silhouette (a mask), not dark letters painted on top — on a light background
  a painted letter would vanish. They are paths, never <text>: nothing here may
  depend on the fonts installed in the Steam client.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" color="#8b9198" role="img" aria-labelledby="sc-logo-title">
  <title id="sc-logo-title">Steamcord</title>

  <mask id="sc-logo-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="#000"/>
    <g transform="translate(7 11) scale(.82)">
      <!-- Mascot silhouette (drawn here, not traced from Discord's own mark). -->
      <path fill="#fff" d="M13 6C18 4 23 3 26 3L28 7C30.6 6.6 33.4 6.6 36 7L38 3C41 3 46 4 51 6C58 16 61 26 60 37C55 41 50 43 45 44L42 39C44.5 38.2 46.8 37 48.8 35.5L47.6 34.6C37.5 39.4 26.5 39.4 16.4 34.6L15.2 35.5C17.2 37 19.5 38.2 22 39L19 44C14 43 9 41 4 37C3 26 6 16 13 6Z"/>
      <!-- S and C, punched back out in black = transparent in the final mark. -->
      <path stroke="#000" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" d="M28.2 17.4C26.9 15.9 24.9 15.4 23.1 15.4C20.4 15.4 18.4 16.8 18.4 19C18.4 21.3 20.4 22 23 22.8C25.8 23.6 27.9 24.4 27.9 27C27.9 29.3 25.8 30.8 22.9 30.8C20.6 30.8 18.8 30 17.6 28.6"/>
      <path stroke="#000" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" d="M46.2 17.9C45 16.3 42.9 15.4 40.6 15.4C36.2 15.4 33.2 18.6 33.2 23.1C33.2 27.6 36.2 30.8 40.6 30.8C42.9 30.8 45 29.9 46.2 28.3"/>
    </g>
    <!-- A gap around the joint, so the two do not merge into one blob at 24-32px. -->
    <circle cx="58.6" cy="24.3" r="4.7" fill="#000"/>
  </mask>

  <!-- Orbit first: the silhouette covers the part that passes behind it. -->
  <ellipse cx="32" cy="33" rx="28" ry="10.5" stroke="currentColor" stroke-width="1.8" opacity=".75" transform="rotate(-18 32 33)"/>
  <rect width="64" height="64" fill="currentColor" mask="url(#sc-logo-cut)"/>
  <!-- The joint the orbit ends on, at t=0 of the rotated ellipse. -->
  <circle cx="58.6" cy="24.3" r="3.1" fill="currentColor"/>
</svg>
