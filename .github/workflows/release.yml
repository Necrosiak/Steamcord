name: release
run-name: Build & publish plugin release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test Windows runtime boundaries
        run: python -m unittest discover -s tests -p "test_windows*.py" -v
      - name: Test cloud game detection boundaries
        run: python -m unittest discover -s tests -p test_cloud_game.py -v
      - name: Test support diagnostics
        run: python -m unittest discover -s tests -p test_support_diagnostics.py -v

  release-plugin:
    needs: windows-host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Setup PNPM@9
        uses: pnpm/action-setup@v4
        with:
          version: "9.4.0"

      - name: Build frontend from source
        run: |
          pnpm i
          pnpm run build

      - name: Test menu and expanded view lifecycle
        run: |
          node tests/steam-menu-lifecycle.test.cjs
          node --test tests/test-menu-entry-toggle.cjs
          node --test tests/test-host-capabilities.cjs tests/test-desktop-capture.cjs
          node --test tests/test-stream-visibility.cjs tests/test-video-visibility-leases.cjs
          python3 -m unittest discover -s tests -p test_video_visibility.py -v

      - name: Test private conversation ordering and navigation regressions
        run: |
          python3 -m unittest discover -s tests -p test_dm_preferences.py -v
          python3 -m unittest discover -s tests -p test_controller_input.py -v
          node tests/test-dm-channels.cjs
          node tests/test-dm-pin-navigation.cjs
          node tests/test-notify-audioloader.cjs
          node tests/test-notify-isolation.cjs
          python3 -m unittest discover -s tests -p test_discord_runtime.py -v
          python3 -m unittest discover -s tests -p test_overlay_environment.py -v
          python3 -m unittest discover -s tests -p test_audio_overlay_regressions.py -v
          node --test tests/test-video-overlay-regressions.cjs
          python3 -m unittest discover -s tests -p test_cloud_game.py -v
          python3 -m unittest discover -s tests -p test_support_diagnostics.py -v
          python3 -m unittest discover -s tests -p test_menu_entry_backend.py -v
          python3 -m unittest discover -s tests -p test_cdp_port.py -v
          node --test tests/test-cloud-rpc.cjs
          python3 -m unittest discover -s tests -p test_dbus_next_py315.py -v
          python3 -m unittest discover -s tests -p test_steam_display_env.py -v
          python3 -m unittest discover -s tests -p test_netproxy.py -v
          node --test tests/test-chat-panel-layout.cjs tests/test-runtime-control.cjs tests/test-runtime-state.cjs tests/test-proxy-panel.cjs

      - name: Download Decky Plugin CLI
        run: |
          mkdir $(pwd)/cli
          curl -L -o $(pwd)/cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-linux-x86_64"
          chmod +x $(pwd)/cli/decky

      - name: Build plugin ZIP
        run: |
          $(pwd)/cli/decky plugin build $(pwd)

      - name: Check Windows runtime in plugin ZIP
        run: |
          python3 - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile("out/Steamcord.zip") as archive:
              for name in ("host.py", "vesktop_win.py"):
                  assert "Steamcord/" + name in archive.namelist(), name
          PYTHON

      - name: Read release notes from changelog
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          version = json.loads(Path("package.json").read_text())["version"]
          text = Path("CHANGELOG.md").read_text()
          heading = "## " + version + " — "
          sections = text.split(heading)
          if len(sections) != 2:
              raise SystemExit("Expected exactly one changelog section for " + version)
          body = sections[1].split("\n", 1)[1].split("\n## ", 1)[0].strip()
          if not body:
              raise SystemExit("Release notes must not be empty")
          Path("RELEASE-NOTES.md").write_text(body + "\n")
          PYTHON

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ github.event.repository.name }}.zip
          body_path: RELEASE-NOTES.md
          generate_release_notes: false
