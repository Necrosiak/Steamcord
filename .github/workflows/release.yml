name: release
run-name: Build & publish plugin release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # #114 : attestation de provenance du zip (Sigstore, sans clé à gérer).
  id-token: write
  attestations: write

jobs:
  windows-host:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Test Windows runtime boundaries
        run: python -m unittest discover -s tests -p "test_windows*.py" -v
      - name: Test local endpoint authentication and update integrity
        run: |
          python -m unittest discover -s tests -p test_local_routes_auth.py -v
          python -m unittest discover -s tests -p test_steam_view.py -v
          python -m unittest discover -s tests -p test_updater_integrity.py -v
      - name: Test cloud game detection boundaries
        run: python -m unittest discover -s tests -p test_cloud_game.py -v
      - name: Test support diagnostics and overlay boundaries
        run: |
          python -m unittest discover -s tests -p test_support_diagnostics.py -v
          python -m unittest discover -s tests -p test_issue102_portrait.py -v
          python -m unittest discover -s tests -p test_pov_selection.py -v
          python -m unittest discover -s tests -p test_golive_gain.py -v
          python -m unittest discover -s tests -p test_overlay_scaling.py -v

  release-plugin:
    needs: windows-host
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22.21.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'

      - name: Setup PNPM@9
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9.4.0"

      - name: Build frontend from source
        run: |
          pnpm i --frozen-lockfile
          pnpm run build

      - name: Test menu and expanded view lifecycle
        run: |
          node tests/steam-menu-lifecycle.test.cjs
          node --test tests/test-menu-entry-toggle.cjs
          node --test tests/test-guild-folders-threads.cjs
          node --test tests/test-err-code.cjs
          node --test tests/test-host-capabilities.cjs tests/test-desktop-capture.cjs
          node --test tests/test-stream-visibility.cjs tests/test-video-visibility-leases.cjs
          node --test tests/test-discord-compat.cjs tests/test-steam-compat.cjs tests/test-steam-view.cjs tests/test-login-completion.cjs tests/test-video-fullscreen-layout.cjs
          python3 -m unittest discover -s tests -p test_video_visibility.py -v

      - name: Test private conversation ordering and navigation regressions
        run: |
          python3 -m unittest discover -s tests -p test_dm_preferences.py -v
          python3 -m unittest discover -s tests -p test_controller_input.py -v
          node tests/test-dm-channels.cjs
          node tests/test-dm-pin-navigation.cjs
          node tests/test-notify-audioloader.cjs
          node tests/test-notify-isolation.cjs
          python3 -m unittest discover -s tests -p test_discord_runtime.py -v
          python3 -m unittest discover -s tests -p test_overlay_environment.py -v
          python3 -m unittest discover -s tests -p test_audio_overlay_regressions.py -v
          python3 -m unittest discover -s tests -p test_local_security.py -v
          python3 -m unittest discover -s tests -p test_local_routes_auth.py -v
          python3 -m unittest discover -s tests -p test_steam_view.py -v
          python3 -m unittest discover -s tests -p test_chatmix_events.py -v
          python3 -m unittest discover -s tests -p test_video_foreground.py -v
          python3 -m unittest discover -s tests -p test_updater_integrity.py -v
          node --test tests/test-video-overlay-regressions.cjs
          python3 -m unittest discover -s tests -p test_cloud_game.py -v
          python3 -m unittest discover -s tests -p test_support_diagnostics.py -v
          python3 -m unittest discover -s tests -p test_menu_entry_backend.py -v
          python3 -m unittest discover -s tests -p test_cdp_port.py -v
          python3 -m unittest discover -s tests -p test_threads_backend.py -v
          python3 -m unittest discover -s tests -p test_desktop_off_wait.py -v
          python3 -m unittest discover -s tests -p test_cdp_sessions.py -v
          node --test tests/test-cloud-rpc.cjs
          python3 -m unittest discover -s tests -p test_dbus_next_py315.py -v
          python3 -m unittest discover -s tests -p test_steam_display_env.py -v
          python3 -m unittest discover -s tests -p test_issue102_portrait.py -v
          python3 -m unittest discover -s tests -p test_pov_selection.py -v
          python3 -m unittest discover -s tests -p test_golive_gain.py -v
          python3 -m unittest discover -s tests -p test_overlay_scaling.py -v
          node --test tests/test-overlay-scaling.cjs
          node --test tests/test-pov-source.cjs tests/test-video-fullscreen-layout.cjs
          python3 -m unittest discover -s tests -p test_netproxy.py -v
          node --test tests/test-chat-panel-layout.cjs tests/test-runtime-control.cjs tests/test-runtime-state.cjs tests/test-proxy-panel.cjs

      - name: Download Decky Plugin CLI
        run: |
          mkdir $(pwd)/cli
          curl --fail --location --proto '=https' --proto-redir '=https' -o "$(pwd)/cli/decky" "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64"
          echo "6777e356508c1ce887f8e61b0fa4954bb48b32e6d97341eef68ea4e0d6ead9a0  cli/decky" | sha256sum --check
          chmod +x $(pwd)/cli/decky

      - name: Build plugin ZIP
        run: |
          $(pwd)/cli/decky plugin build $(pwd)

      - name: Check Windows runtime in plugin ZIP
        run: |
          python3 - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile("out/Steamcord.zip") as archive:
              for name in ("host.py", "vesktop_win.py"):
                  assert "Steamcord/" + name in archive.namelist(), name
          PYTHON

      - name: Checksum and build provenance
        run: |
          cd out
          sha256sum ${{ github.event.repository.name }}.zip > ${{ github.event.repository.name }}.zip.sha256
          cat ${{ github.event.repository.name }}.zip.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/${{ github.event.repository.name }}.zip

      - name: Read release notes from changelog
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          version = json.loads(Path("package.json").read_text())["version"]
          text = Path("CHANGELOG.md").read_text()
          heading = "## " + version + " — "
          sections = text.split(heading)
          if len(sections) != 2:
              raise SystemExit("Expected exactly one changelog section for " + version)
          body = sections[1].split("\n", 1)[1].split("\n## ", 1)[0].strip()
          if not body:
              raise SystemExit("Release notes must not be empty")
          Path("RELEASE-NOTES.md").write_text(body + "\n")
          PYTHON

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            out/${{ github.event.repository.name }}.zip
            out/${{ github.event.repository.name }}.zip.sha256
          body_path: RELEASE-NOTES.md
          generate_release_notes: false
